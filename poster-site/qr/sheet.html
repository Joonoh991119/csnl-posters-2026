<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>QR codes — print sheet</title>
<style>
  body { font: 13px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #16181c;
         margin: 28px; background: #fff; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.note { color: #666c74; margin: 0 0 22px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 26px; }
  figure { margin: 0; }
  img { width: 100%; height: auto; border: 1px solid #e3e3df; display: block; }
  figcaption { margin-top: 7px; font-size: 12px; line-height: 1.45; }
  figcaption b { color: #c22f27; letter-spacing: .05em; }
  figcaption span { color: #666c74; word-break: break-all; font-size: 11px; }
  @media print { body { margin: 12mm; } p.note { display: none; } }
</style></head><body>
<h1>QR codes — https://joonoh991119.github.io/csnl-posters-2026</h1>
<p class="note">Print at 100%. On the poster, place the code at least 30 mm square with the
URL printed beside it in readable type — cameras fail often enough that the text matters.</p>
<div class="grid"><figure><img src="index.svg" alt="QR for CSNL Posters 2026"><figcaption><b>ALL</b> CSNL Posters 2026<br><span>https://joonoh991119.github.io/csnl-posters-2026/</span></figcaption></figure><figure><img src="jop.svg" alt="QR for 박준오"><figcaption><b>P1</b> 박준오<br><span>https://joonoh991119.github.io/csnl-posters-2026/p/jop.html</span></figcaption></figure><figure><img src="byl.svg" alt="QR for 이보연"><figcaption><b>P2</b> 이보연<br><span>https://joonoh991119.github.io/csnl-posters-2026/p/byl.html</span></figcaption></figure><figure><img src="smj.svg" alt="QR for 정새미"><figcaption><b>P3</b> 정새미<br><span>https://joonoh991119.github.io/csnl-posters-2026/p/smj.html</span></figcaption></figure></div>
</body></html>
